<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 326" width="100%" height="100%" role="img" aria-label="Stack and Tooling: Frontend, Backend, Mobile, AI, Cloud, and Design">
  <defs>
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070310" />
      <stop offset="50%" stop-color="#0b0618" />
      <stop offset="100%" stop-color="#120926" />
    </linearGradient>

    <linearGradient id="violetFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d6e" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2e1654" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="quadSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120924" />
      <stop offset="100%" stop-color="#080412" />
    </linearGradient>

    <linearGradient id="sulaimanBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </linearGradient>

    <pattern id="noirGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a855f7" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    <clipPath id="stackClip">
      <rect x="2" y="2" width="916" height="258" rx="16" />
    </clipPath>
  </defs>

  <!-- ================= MAIN STACK STUDIO CARD ================= -->
  <rect x="2" y="2" width="916" height="258" rx="16" fill="url(#noirBg)" />

  <g clip-path="url(#stackClip)">
    <rect x="2" y="2" width="916" height="258" fill="url(#noirGrid)" />
    <g transform="rotate(-32 220 140)">
      <rect x="-80" y="60" width="500" height="60" fill="url(#beamFooter)" />
    </g>
  </g>

  <rect x="2" y="2" width="916" height="258" rx="16" fill="none" stroke="url(#violetFrame)" stroke-width="1.5" />

  <!-- Section Eyebrow Header -->
  <rect x="24" y="21" width="12" height="12" rx="3" fill="#a855f7" fill-opacity="0.22" />
  <rect x="26.5" y="23.5" width="7" height="7" rx="1.5" fill="#c084fc" />
  <text x="44" y="31" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#f5f3ff" letter-spacing="2">
    STACK &amp; TOOLING
  </text>
  <text x="896" y="31" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10" font-weight="600" fill="#7c6f99" letter-spacing="1.2">
    CORE ENGINEERING MATRIX
  </text>
  <line x1="24" y1="48" x2="896" y2="48" stroke="#261542" stroke-width="1" />

  <!-- Quadrant 01: Frontend & Motion -->
  <g transform="translate(24, 64)">
    <rect x="0" y="0" width="428" height="80" rx="11" fill="url(#quadSurface)" stroke="#29164a" stroke-width="1.1" />
    <text x="16" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="#c084fc" letter-spacing="1">
      01 // FRONTEND &amp; MOTION
    </text>

    <g transform="translate(0, 38)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#f5f3ff">
      <rect x="16" y="0" width="56" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="44" y="16.5" text-anchor="middle">Next.js</text>

      <rect x="77" y="0" width="62" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="108" y="16.5" text-anchor="middle">React 19</text>

      <rect x="144" y="0" width="74" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="181" y="16.5" text-anchor="middle">TypeScript</text>

      <rect x="223" y="0" width="62" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="254" y="16.5" text-anchor="middle">Tailwind</text>

      <rect x="290" y="0" width="62" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="321" y="16.5" text-anchor="middle">Three.js</text>

      <rect x="357" y="0" width="55" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="384.5" y="16.5" text-anchor="middle">Motion</text>
    </g>
  </g>

  <!-- Quadrant 02: Backend & Commerce -->
  <g transform="translate(468, 64)">
    <rect x="0" y="0" width="428" height="80" rx="11" fill="url(#quadSurface)" stroke="#29164a" stroke-width="1.1" />
    <text x="16" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="#d8b4fe" letter-spacing="1">
      02 // BACKEND &amp; COMMERCE
    </text>

    <g transform="translate(0, 38)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#f5f3ff">
      <rect x="16" y="0" width="62" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="47" y="16.5" text-anchor="middle">Supabase</text>

      <rect x="83" y="0" width="74" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="120" y="16.5" text-anchor="middle">PostgreSQL</text>

      <rect x="162" y="0" width="58" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="191" y="16.5" text-anchor="middle">Node.js</text>

      <rect x="225" y="0" width="62" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="256" y="16.5" text-anchor="middle">Firebase</text>

      <rect x="292" y="0" width="56" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="320" y="16.5" text-anchor="middle">Stripe</text>

      <rect x="353" y="0" width="59" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="382.5" y="16.5" text-anchor="middle">Sanity</text>
    </g>
  </g>

  <!-- Quadrant 03: Mobile & Intelligence -->
  <g transform="translate(24, 156)">
    <rect x="0" y="0" width="428" height="80" rx="11" fill="url(#quadSurface)" stroke="#29164a" stroke-width="1.1" />
    <text x="16" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="#a5b4fc" letter-spacing="1">
      03 // MOBILE &amp; INTELLIGENCE
    </text>

    <g transform="translate(0, 38)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#f5f3ff">
      <rect x="16" y="0" width="56" height="26" rx="6" fill="#170f33" stroke="#322363" stroke-width="1" />
      <text x="44" y="16.5" text-anchor="middle">Flutter</text>

      <rect x="77" y="0" width="43" height="26" rx="6" fill="#170f33" stroke="#322363" stroke-width="1" />
      <text x="98.5" y="16.5" text-anchor="middle">Dart</text>

      <rect x="125" y="0" width="53" height="26" rx="6" fill="#170f33" stroke="#322363" stroke-width="1" />
      <text x="151.5" y="16.5" text-anchor="middle">Python</text>

      <rect x="183" y="0" width="79" height="26" rx="6" fill="#170f33" stroke="#322363" stroke-width="1" />
      <text x="222.5" y="16.5" text-anchor="middle">Spring Boot</text>

      <rect x="267" y="0" width="70" height="26" rx="6" fill="#170f33" stroke="#322363" stroke-width="1" />
      <text x="302" y="16.5" text-anchor="middle">Claude AI</text>

      <rect x="342" y="0" width="70" height="26" rx="6" fill="#170f33" stroke="#322363" stroke-width="1" />
      <text x="377" y="16.5" text-anchor="middle">Gemini AI</text>
    </g>
  </g>

  <!-- Quadrant 04: Design, Cloud & Delivery -->
  <g transform="translate(468, 156)">
    <rect x="0" y="0" width="428" height="80" rx="11" fill="url(#quadSurface)" stroke="#29164a" stroke-width="1.1" />
    <text x="16" y="24" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="#c4b5fd" letter-spacing="1">
      04 // DESIGN, CLOUD &amp; DELIVERY
    </text>

    <g transform="translate(0, 38)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#f5f3ff">
      <rect x="16" y="0" width="56" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="44" y="16.5" text-anchor="middle">Figma</text>

      <rect x="78" y="0" width="62" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="109" y="16.5" text-anchor="middle">Vercel</text>

      <rect x="146" y="0" width="92" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="192" y="16.5" text-anchor="middle">Git &amp; GitHub</text>

      <rect x="244" y="0" width="80" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="284" y="16.5" text-anchor="middle">REST &amp; SQL</text>

      <rect x="330" y="0" width="82" height="26" rx="6" fill="#190d33" stroke="#361e63" stroke-width="1" />
      <text x="371" y="16.5" text-anchor="middle">Architecture</text>
    </g>
  </g>

  <!-- ================= CLOSING SIGN-OFF BAR ================= -->
  <rect x="2" y="276" width="916" height="48" rx="13" fill="#090413" stroke="#261542" stroke-width="1.2" />
  <rect x="280" y="276" width="360" height="1.5" fill="url(#glowViolet)" />

  <!-- Mini [S] Violet Brand Mark + Tagline -->
  <rect x="24" y="291" width="18" height="18" rx="3" fill="url(#sulaimanBox)" />
  <text x="33" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#ffffff">
    S
  </text>
  <text x="52" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#e9d5ff" letter-spacing="3.2">
    THINKING DIFFERENTLY
  </text>
  <text x="250" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" fill="#8e81ab">
    ·  Build thoughtfully. Ship intentionally.
  </text>

  <!-- Right Handle & Location -->
  <text x="896" y="304" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10.5" fill="#c4b5fd">
    Sulaiman Sabry <tspan fill="#7c6f99">(@Spark014)</tspan> · Kawn Labs · Colombo, LK
  </text>
</svg>
