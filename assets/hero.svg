<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 272" width="100%" height="100%" role="img" aria-label="Sulaiman Sabry — Thinking Differently | Co-Founder at Kawn Labs">
  <defs>
    <!-- Deep Obsidian-Violet Noir Background -->
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070310" />
      <stop offset="48%" stop-color="#0b0618" />
      <stop offset="100%" stop-color="#120926" />
    </linearGradient>

    <!-- Diagonal Volumetric Violet Light Beam 1 (LinkedIn Banner Inspiration) -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>

    <!-- Diagonal Volumetric Violet Light Beam 2 -->
    <linearGradient id="beam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </linearGradient>

    <!-- Studio Rim Glow (Right Knight Halo) -->
    <radialGradient id="knightHalo" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0b0618" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Left Rim Glow (Portrait Rim-Light Inspiration) -->
    <radialGradient id="leftRim" cx="8%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070310" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Frame Border -->
    <linearGradient id="violetFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d6e" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#2e1654" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.5" />
    </linearGradient>

    <!-- Signature LinkedIn Purple Name Box -->
    <linearGradient id="sulaimanBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Quote Accent Bar -->
    <linearGradient id="violetBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Right Card Surface -->
    <linearGradient id="rightCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110922" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#080411" stop-opacity="0.96" />
    </linearGradient>

    <!-- Subtle Architectural Grid -->
    <pattern id="noirGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a855f7" stroke-opacity="0.06" stroke-width="1" />
    </pattern>

    <!-- Clip Main Card -->
    <clipPath id="mainClip">
      <rect x="2" y="2" width="916" height="268" rx="16" />
    </clipPath>

    <!-- Clip Knight Header -->
    <clipPath id="knightClip">
      <rect x="608" y="24" width="284" height="104" rx="12" />
    </clipPath>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="916" height="268" rx="16" fill="url(#noirBg)" />

  <!-- Clipped Atmospheric Light Beams & Grid -->
  <g clip-path="url(#mainClip)">
    <rect x="2" y="2" width="916" height="268" fill="url(#noirGrid)" />
    <rect x="2" y="2" width="916" height="268" fill="url(#leftRim)" />

    <!-- Diagonal Violet Studio Streaks -->
    <g transform="rotate(-32 220 120)">
      <rect x="-120" y="-40" width="520" height="76" fill="url(#beam1)" />
      <rect x="-80" y="65" width="560" height="44" fill="url(#beam2)" />
    </g>
  </g>

  <!-- Crisp Border Stroke -->
  <rect x="2" y="2" width="916" height="268" rx="16" fill="none" stroke="url(#violetFrame)" stroke-width="1.5" />

  <!-- Vertical Studio Divider -->
  <line x1="586" y1="26" x2="586" y2="246" stroke="#261542" stroke-width="1" />

  <!-- ================= LEFT COLUMN: LINKEDIN IDENTITY & VOICE ================= -->
  <!-- Eyebrow Status -->
  <g transform="translate(36, 38)">
    <circle cx="5" cy="0" r="4" fill="#a855f7" />
    <circle cx="5" cy="0" r="8" fill="#a855f7" fill-opacity="0.28">
      <animate attributeName="r" values="5;9.5;5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.35;0.05;0.35" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="4" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10.5" font-weight="600" fill="#c4b5fd" letter-spacing="1.8">
      CO-FOUNDER @ KAWN LABS  ·  COLOMBO, LK
    </text>
  </g>

  <!-- Signature [Sulaiman] Sabry Wordmark (Inspired by LinkedIn Banner) -->
  <g transform="translate(36, 58)">
    <!-- Solid Electric Violet Highlight Block behind "Sulaiman" -->
    <rect x="0" y="2" width="164" height="40" rx="3" fill="url(#sulaimanBox)" />
    <text x="82" y="31.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.6">
      Sulaiman
    </text>

    <!-- "Sabry" in Luminous Lavender-Silver -->
    <text x="175" y="31.5" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#d8b4fe" letter-spacing="-0.4">
      Sabry
    </text>

    <!-- Handle Tag -->
    <text x="276" y="28.5" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="13" font-weight="500" fill="#7c6f99">
      // @Spark014
    </text>

    <!-- THINKING DIFFERENTLY Tagline -->
    <text x="2" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#e9d5ff" fill-opacity="0.88" letter-spacing="5.2">
      THINKING DIFFERENTLY
    </text>
  </g>

  <!-- LinkedIn Signature Quote Callout -->
  <g transform="translate(36, 134)">
    <rect x="0" y="0" width="522" height="34" rx="7" fill="#140b29" fill-opacity="0.82" stroke="#2d1950" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="34" rx="1.75" fill="url(#violetBar)" />
    <text x="15" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#ede9fe">
      &#x201C;I build websites. Apparently that makes me a Co-Founder at Kawn Labs.&#x201D;
    </text>
  </g>

  <!-- Positioning Copy -->
  <g transform="translate(36, 193)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="12.5" fill="#a398bf">
      Where <tspan fill="#f5f3ff" font-weight="600">software engineering</tspan>, <tspan fill="#f5f3ff" font-weight="600">product design</tspan>, and <tspan fill="#f5f3ff" font-weight="600">strategy</tspan> intersect —
    </text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="12.5" fill="#a398bf">
      turning complex workflows into fast, polished digital products people enjoy using.
    </text>
  </g>

  <!-- Academic Line -->
  <g transform="translate(36, 243)">
    <text x="0" y="0" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10.5" fill="#7c6f99" letter-spacing="0.3">
      BEng (Hons) Software Engineering · University of Westminster
    </text>
  </g>

  <!-- ================= RIGHT CARD: FACETED CHESS KNIGHT & STUDIO SPEC ================= -->
  <rect x="608" y="24" width="284" height="224" rx="12" fill="url(#rightCardBg)" stroke="#2b174d" stroke-width="1.2" />

  <!-- Sculpted Low-Poly Obsidian Chess Knight Header -->
  <g clip-path="url(#knightClip)">
    <!-- Violet Rim Backlight -->
    <circle cx="750" cy="78" r="58" fill="url(#knightHalo)" />

    <!-- Subtle Strategic Perspective Grid -->
    <path d="M608 112 H892 M628 128 L690 96 M690 128 L730 96 M770 96 L810 128 M810 96 L872 128" stroke="#8b5cf6" stroke-opacity="0.14" stroke-width="1" fill="none" />

    <!-- Corner Micro-Labels -->
    <text x="622" y="41" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#7c6f99" letter-spacing="1.2">
      STRATEGY // CRAFT
    </text>
    <text x="878" y="41" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="8.5" fill="#c084fc" letter-spacing="1">
      KAWN LABS
    </text>

    <!-- Low-Poly Sculpted Obsidian Chess Knight (Facing Right, Violet Rim-Lit) -->
    <g transform="translate(750, 83) scale(0.83)">
      <!-- Pedestal Base -->
      <polygon points="-26,42 26,42 22,34 -22,34" fill="#170d2e" stroke="#a855f7" stroke-opacity="0.5" stroke-width="0.9" />
      <polygon points="-22,34 22,34 17,28 -17,28" fill="#241346" stroke="#c084fc" stroke-opacity="0.45" stroke-width="0.8" />

      <!-- Mane & Back Neck Facets (Bright Left Violet Rim-Light!) -->
      <polygon points="-17,28 -24,8 -10,12" fill="#3b1c70" />
      <polygon points="-24,8 -23,-14 -9,-4 -10,12" fill="#4c1d95" />
      <polygon points="-23,-14 -16,-31 -5,-19 -9,-4" fill="#5b21b6" />
      <polygon points="-16,-31 -8,-43 -2,-29 -5,-19" fill="#6d28d9" />

      <!-- Ears (Sharp Sculpted Twin Peaks) -->
      <polygon points="-8,-43 -3,-53 2,-39 -2,-29" fill="#7c3aed" />
      <polygon points="0,-41 6,-50 8,-37 2,-39" fill="#4c1d95" />

      <!-- Core Head & Muzzle Facets (Obsidian Dark Core + Crisp Planes) -->
      <polygon points="-2,-29 8,-37 19,-24 4,-17" fill="#231242" />
      <polygon points="4,-17 19,-24 30,-11 16,-6" fill="#190c31" />
      <polygon points="16,-6 30,-11 27,-3 15,-1" fill="#2d1657" />
      <!-- Jaw & Cheek Plane -->
      <polygon points="-5,-19 4,-17 16,-6 4,-3 -9,-4" fill="#140926" />
      <polygon points="4,-3 15,-1 9,4 -1,1" fill="#0d061a" />

      <!-- Chest & Lower Neck Facets -->
      <polygon points="-9,-4 4,-3 12,13 -10,12" fill="#1a0d33" />
      <polygon points="-10,12 12,13 17,28 -17,28" fill="#110822" />
      <!-- Right Chest Rim Highlight -->
      <polygon points="4,-3 9,4 16,16 17,28 12,13" fill="#29154e" />

      <!-- Subtle Glowing Eye Facet -->
      <polygon points="6,-25 11,-23 8,-20" fill="#e9d5ff" fill-opacity="0.85" />

      <!-- Electric Violet Rim-Light Contour Lines -->
      <polyline points="-17,28 -24,8 -23,-14 -16,-31 -8,-43 -3,-53 2,-39 6,-50 8,-37 19,-24 30,-11 27,-3 15,-1 9,4" fill="none" stroke="#d8b4fe" stroke-opacity="0.75" stroke-width="1.2" stroke-linejoin="round" />
      <polyline points="-24,8 -9,-4 -5,-19 -2,-29" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="0.8" />
      <polyline points="-9,-4 4,-17 19,-24" fill="none" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="0.8" />
    </g>
  </g>

  <line x1="622" y1="128" x2="878" y2="128" stroke="#261542" stroke-width="1" />

  <!-- Spec Sheet Rows -->
  <g font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10.5">
    <text x="624" y="149" fill="#7c6f99">VENTURE</text>
    <text x="876" y="149" text-anchor="end" fill="#f5f3ff" font-weight="600">Kawn Labs (Pvt) Ltd</text>

    <text x="624" y="172" fill="#7c6f99">FOCUS</text>
    <text x="876" y="172" text-anchor="end" fill="#d8b4fe" font-weight="600">Web · Systems · AI</text>

    <text x="624" y="195" fill="#7c6f99">COORDS</text>
    <text x="876" y="195" text-anchor="end" fill="#a398bf">6.9271° N, 79.8612° E</text>
  </g>

  <!-- Bottom Action / Status Chip -->
  <rect x="624" y="211" width="252" height="24" rx="6" fill="#180c30" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1" />
  <text x="750" y="226.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="9.5" font-weight="600" fill="#d8b4fe" letter-spacing="1.1">
    &#x25CF; OPEN FOR SELECT PROJECTS
  </text>
</svg>
