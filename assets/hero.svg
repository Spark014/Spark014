<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="100%" height="100%" role="img" aria-label="Sulaiman Sabry — Co-Founder at Kawn Labs, Software Engineering, Product Design and Business Systems">
  <defs>
    <!-- Deep Studio Background -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="55%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#101829" />
    </linearGradient>

    <!-- Aurora Studio Glow (Right) -->
    <radialGradient id="auroraGlow" cx="80%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Secondary Glow (Bottom Left) -->
    <radialGradient id="iceGlow" cx="12%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <!-- Frame Border Gradient -->
    <linearGradient id="frameStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Quote Accent Bar -->
    <linearGradient id="quoteBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Right Card Surface -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.92" />
    </linearGradient>

    <!-- Architectural Line Grid -->
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1" />
    </pattern>

    <!-- Clip for Right Orbital Header -->
    <clipPath id="orbitalClip">
      <rect x="608" y="26" width="284" height="88" rx="12" />
    </clipPath>
  </defs>

  <!-- Main Card Frame -->
  <rect x="2" y="2" width="916" height="261" rx="16" fill="url(#heroBg)" stroke="url(#frameStroke)" stroke-width="1.5" />
  <rect x="2" y="2" width="916" height="261" rx="16" fill="url(#archGrid)" />
  <rect x="2" y="2" width="916" height="261" rx="16" fill="url(#auroraGlow)" />
  <rect x="2" y="2" width="916" height="261" rx="16" fill="url(#iceGlow)" />

  <!-- Subtle Vertical Divider -->
  <line x1="586" y1="28" x2="586" y2="237" stroke="#1e293b" stroke-width="1" />

  <!-- ================= LEFT EDITORIAL COLUMN ================= -->
  <!-- Eyebrow Status -->
  <g transform="translate(36, 40)">
    <circle cx="5" cy="0" r="4" fill="#10b981" />
    <circle cx="5" cy="0" r="8" fill="#10b981" fill-opacity="0.25">
      <animate attributeName="r" values="5;9;5" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.3;0.04;0.3" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="4" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10.5" font-weight="600" fill="#93c5fd" letter-spacing="1.8">
      CO-FOUNDER @ KAWN LABS  ·  COLOMBO, LK
    </text>
  </g>

  <!-- Display Name + Handle -->
  <g transform="translate(36, 94)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Helvetica, sans-serif" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.8">
      Sulaiman Sabry<tspan dx="12" dy="-4" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="14" font-weight="500" fill="#64748b" letter-spacing="0">// @Spark014</tspan>
    </text>
  </g>

  <!-- LinkedIn Signature Quote Callout -->
  <g transform="translate(36, 116)">
    <rect x="0" y="0" width="522" height="34" rx="7" fill="#131c2e" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="3.5" height="34" rx="1.75" fill="url(#quoteBar)" />
    <text x="15" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="12.5" font-style="italic" fill="#e2e8f0">
      &#x201C;I build websites. Apparently that makes me a Co-Founder at Kawn Labs.&#x201D;
    </text>
  </g>

  <!-- Positioning Copy -->
  <g transform="translate(36, 178)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="12.5" fill="#94a3b8">
      Where <tspan fill="#f1f5f9" font-weight="600">software engineering</tspan>, <tspan fill="#f1f5f9" font-weight="600">product design</tspan>, and <tspan fill="#f1f5f9" font-weight="600">business</tspan> intersect —
    </text>
    <text x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="12.5" fill="#94a3b8">
      turning complex workflows into fast, polished digital products people enjoy using.
    </text>
  </g>

  <!-- Academic & Principle Footer Line -->
  <g transform="translate(36, 233)">
    <text x="0" y="0" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10.5" fill="#64748b" letter-spacing="0.4">
      BEng (Hons) Software Engineering · University of Westminster
    </text>
  </g>

  <!-- ================= RIGHT STUDIO ORBITAL CARD ================= -->
  <rect x="608" y="26" width="284" height="213" rx="12" fill="url(#cardSurface)" stroke="#1e293b" stroke-width="1" />

  <!-- Orbital Geometry Visual (Inspired by Kawn Labs Orbital System) -->
  <g clip-path="url(#orbitalClip)">
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <circle cx="750" cy="76" r="44" fill="url(#coreHalo)" />

    <!-- Tilted Orbit 1 -->
    <g transform="translate(750, 76) rotate(-12)">
      <ellipse cx="0" cy="0" rx="92" ry="22" fill="none" stroke="#3b82f6" stroke-opacity="0.34" stroke-width="1" />
      <circle cx="-75" cy="-12" r="3.2" fill="#93c5fd" />
    </g>

    <!-- Tilted Orbit 2 -->
    <g transform="translate(750, 76) rotate(16)">
      <ellipse cx="0" cy="0" rx="58" ry="16" fill="none" stroke="#818cf8" stroke-opacity="0.42" stroke-width="1" stroke-dasharray="4 3" />
      <circle cx="49" cy="8" r="2.8" fill="#a5b4fc" />
    </g>

    <!-- Center Core -->
    <circle cx="750" cy="76" r="10.5" fill="#1e3a8a" fill-opacity="0.6" stroke="#60a5fa" stroke-opacity="0.6" stroke-width="1" />
    <circle cx="750" cy="76" r="4.2" fill="#e0f2fe" />

    <!-- Subtle Corner Tag -->
    <text x="622" y="42" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#64748b" letter-spacing="1.2">
      KAWN // STUDIO
    </text>
    <text x="878" y="42" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#60a5fa" letter-spacing="1">
      v2026
    </text>
  </g>

  <line x1="622" y1="114" x2="878" y2="114" stroke="#1e293b" stroke-width="1" />

  <!-- Spec Sheet Rows -->
  <g font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="10.5">
    <text x="624" y="136" fill="#64748b">VENTURE</text>
    <text x="876" y="136" text-anchor="end" fill="#f1f5f9" font-weight="600">Kawn Labs (Pvt) Ltd</text>

    <text x="624" y="160" fill="#64748b">FOCUS</text>
    <text x="876" y="160" text-anchor="end" fill="#93c5fd" font-weight="600">Web · Systems · UI</text>

    <text x="624" y="184" fill="#64748b">COORDS</text>
    <text x="876" y="184" text-anchor="end" fill="#94a3b8">6.9271° N, 79.8612° E</text>
  </g>

  <!-- Bottom Action / Status Chip -->
  <rect x="624" y="201" width="252" height="24" rx="6" fill="#111c30" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1" />
  <text x="750" y="216.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="9.5" font-weight="600" fill="#93c5fd" letter-spacing="1.1">
    &#x25CF; OPEN FOR SELECT PROJECTS
  </text>
</svg>
