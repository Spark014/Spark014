    <rect x="294" y="13" width="118" height="21" rx="5" fill="#1b0e38" stroke="#3b206e" stroke-width="0.9" />
    <text x="353" y="27" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#c084fc" letter-spacing="0.8">
