    <rect x="318" y="13" width="94" height="21" rx="5" fill="#181038" stroke="#37266e" stroke-width="0.9" />
    <text x="365" y="27" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#a5b4fc" letter-spacing="0.8">
