    </text>
    <text x="18" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11.8" fill="#a398bf">
      platforms, interactive 3D showcases, and global partnerships.
    </text>
  </g>

