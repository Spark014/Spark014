<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" role="img" aria-label="Selected Work and Ventures: Kawn Labs, The Choice, Hilal Arts, Najm Guides, Sidrbooks, Ledger Engines, Thaqib, Roameo, Deen Scrolling">
  <defs>
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070310" />
      <stop offset="52%" stop-color="#0b0618" />
      <stop offset="100%" stop-color="#120926" />
    </linearGradient>

    <linearGradient id="violetFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d6e" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2e1654" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#130a27" />
      <stop offset="100%" stop-color="#090413" />
    </linearGradient>

    <linearGradient id="beamSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentBarViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="accentBarIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <pattern id="noirGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#a855f7" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    <clipPath id="venturesClip">
      <rect x="2" y="2" width="916" height="396" rx="16" />
    </clipPath>
  </defs>

  <!-- Outer Studio Card -->
  <rect x="2" y="2" width="916" height="396" rx="16" fill="url(#noirBg)" />

  <g clip-path="url(#venturesClip)">
    <rect x="2" y="2" width="916" height="396" fill="url(#noirGrid)" />
    <g transform="rotate(-32 700 90)">
      <rect x="420" y="20" width="520" height="64" fill="url(#beamSoft)" />
    </g>
  </g>

  <rect x="2" y="2" width="916" height="396" rx="16" fill="none" stroke="url(#violetFrame)" stroke-width="1.5" />

  <!-- Section Eyebrow Header -->
  <rect x="24" y="21" width="12" height="12" rx="3" fill="#a855f7" fill-opacity="0.22" />
  <rect x="26.5" y="23.5" width="7" height="7" rx="1.5" fill="#c084fc" />
  <text x="44" y="31" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#f5f3ff" letter-spacing="2">
