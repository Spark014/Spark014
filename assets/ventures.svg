  </text>
  <line x1="24" y1="48" x2="896" y2="48" stroke="#261542" stroke-width="1" />

  <!-- ================= ROW 1 ================= -->
  <!-- Card 01: Kawn Labs -->
  <g transform="translate(24, 64)">
    <rect x="0" y="0" width="428" height="94" rx="11" fill="url(#cardSurface)" stroke="#29164a" stroke-width="1.1" />
    <rect x="0" y="18" width="3" height="58" rx="1.5" fill="url(#accentBarViolet)" />

    <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#faf5ff">
      Kawn Labs
    </text>
    <rect x="300" y="13" width="112" height="21" rx="5" fill="#1b0e38" stroke="#3b206e" stroke-width="0.9" />
    <text x="356" y="27" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="600" fill="#d8b4fe" letter-spacing="0.8">
