  <!-- Card 06: Roameo · Deen Scrolling -->
  <g transform="translate(468, 280)">
    <rect x="0" y="0" width="428" height="94" rx="11" fill="url(#cardSurface)" stroke="#29164a" stroke-width="1.1" />
    <rect x="0" y="18" width="3" height="58" rx="1.5" fill="url(#accentBarViolet)" />

    <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#faf5ff">
