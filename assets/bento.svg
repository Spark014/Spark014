    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.95" />
