<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 206" width="100%" height="100%" role="img" aria-label="Core capabilities: Digital Experiences, Business Software, and Applied AI &amp; Mobile">
  <defs>
    <linearGradient id="bentoCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080c15" />
    </linearGradient>

    <linearGradient id="topBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="topIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="topEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ================= CARD 01: DIGITAL EXPERIENCES ================= -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="296" height="202" rx="14" fill="url(#bentoCard)" stroke="#1e293b" stroke-width="1.2" />
    <rect x="28" y="0" width="240" height="2" fill="url(#topBlue)" />

    <!-- Icon Box -->
    <rect x="22" y="22" width="34" height="34" rx="9" fill="#111e36" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <!-- Minimalist Window / Interface Vector Icon -->
    <rect x="30" y="31" width="18" height="16" rx="2.5" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <line x1="30" y1="36" x2="48" y2="36" stroke="#60a5fa" stroke-width="1.3" />
    <circle cx="33.5" cy="33.5" r="0.9" fill="#93c5fd" />
    <circle cx="36.5" cy="33.5" r="0.9" fill="#93c5fd" />

    <text x="274" y="43" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="1">
      01 // WEB
    </text>

    <text x="22" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      Digital Experiences
    </text>
    <text x="22" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#94a3b8">
      High-craft websites, interactive 3D
    </text>
    <text x="22" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#94a3b8">
      interfaces, and luxury e-commerce.
    </text>

    <line x1="22" y1="156" x2="274" y2="156" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="179" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#60a5fa">
      Next.js · React 19 · Three.js · Motion
    </text>
  </g>

  <!-- ================= CARD 02: BUSINESS SOFTWARE ================= -->
  <g transform="translate(312, 2)">
    <rect x="0" y="0" width="296" height="202" rx="14" fill="url(#bentoCard)" stroke="#1e293b" stroke-width="1.2" />
    <rect x="28" y="0" width="240" height="2" fill="url(#topIndigo)" />

    <!-- Icon Box -->
    <rect x="22" y="22" width="34" height="34" rx="9" fill="#161836" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <!-- Minimalist Layers / Systems Vector Icon -->
    <path d="M39 30 L48 35 L39 40 L30 35 Z" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M30 39.5 L39 44.5 L48 39.5" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 44 L39 49 L48 44" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="274" y="43" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="1">
      02 // SYSTEMS
    </text>

    <text x="22" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      Business Software
    </text>
    <text x="22" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#94a3b8">
      Internal portals, financial ledgers,
    </text>
    <text x="22" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#94a3b8">
      and automated operational workflows.
    </text>

    <line x1="22" y1="156" x2="274" y2="156" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="179" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#818cf8">
      TypeScript · Supabase · SQL · Stripe
    </text>
  </g>

  <!-- ================= CARD 03: APPLIED AI & MOBILE ================= -->
  <g transform="translate(622, 2)">
    <rect x="0" y="0" width="296" height="202" rx="14" fill="url(#bentoCard)" stroke="#1e293b" stroke-width="1.2" />
    <rect x="28" y="0" width="240" height="2" fill="url(#topEmerald)" />

    <!-- Icon Box -->
    <rect x="22" y="22" width="34" height="34" rx="9" fill="#0d2622" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
    <!-- Minimalist Graph / Intelligence Vector Icon -->
    <circle cx="39" cy="39" r="3" fill="none" stroke="#34d399" stroke-width="1.5" />
    <circle cx="32" cy="32" r="2" fill="#6ee7b7" />
    <circle cx="46" cy="32" r="2" fill="#6ee7b7" />
    <circle cx="32" cy="46" r="2" fill="#6ee7b7" />
    <circle cx="46" cy="46" r="2" fill="#6ee7b7" />
    <line x1="33.5" y1="33.5" x2="36.8" y2="36.8" stroke="#34d399" stroke-width="1.3" />
    <line x1="44.5" y1="33.5" x2="41.2" y2="36.8" stroke="#34d399" stroke-width="1.3" />
    <line x1="33.5" y1="44.5" x2="36.8" y2="41.2" stroke="#34d399" stroke-width="1.3" />
    <line x1="44.5" y1="44.5" x2="41.2" y2="41.2" stroke="#34d399" stroke-width="1.3" />

    <text x="274" y="43" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="1">
      03 // R&amp;D
    </text>

    <text x="22" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      Applied AI &amp; Mobile
    </text>
    <text x="22" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#94a3b8">
      Arabic NLP root search, cross-platform
    </text>
    <text x="22" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="12" fill="#94a3b8">
      Flutter apps, and AI-assisted tools.
    </text>

    <line x1="22" y1="156" x2="274" y2="156" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="179" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#34d399">
      Flutter · Python · NLP · LLM APIs
    </text>
  </g>
