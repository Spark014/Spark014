    <path d="M30 39.5 L39 44.5 L48 39.5" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 44 L39 49 L48 44" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

