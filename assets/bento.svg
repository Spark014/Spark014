    <!-- Icon Box -->
    <rect x="22" y="22" width="34" height="34" rx="9" fill="#1a0d36" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1" />
    <rect x="30" y="31" width="18" height="16" rx="2.5" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <line x1="30" y1="36" x2="48" y2="36" stroke="#c084fc" stroke-width="1.3" />
    <circle cx="33.5" cy="33.5" r="0.9" fill="#e9d5ff" />
    <circle cx="36.5" cy="33.5" r="0.9" fill="#e9d5ff" />

    <text x="274" y="43" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#6d5d8c" letter-spacing="1">
