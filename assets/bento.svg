    <circle cx="39" cy="39" r="3" fill="none" stroke="#a5b4fc" stroke-width="1.5" />
    <circle cx="32" cy="32" r="2" fill="#c4b5fd" />
    <circle cx="46" cy="32" r="2" fill="#c4b5fd" />
    <circle cx="32" cy="46" r="2" fill="#c4b5fd" />
    <circle cx="46" cy="46" r="2" fill="#c4b5fd" />
    <line x1="33.5" y1="33.5" x2="36.8" y2="36.8" stroke="#818cf8" stroke-width="1.3" />
    <line x1="44.5" y1="33.5" x2="41.2" y2="36.8" stroke="#818cf8" stroke-width="1.3" />
    <line x1="33.5" y1="44.5" x2="36.8" y2="41.2" stroke="#818cf8" stroke-width="1.3" />
    <line x1="44.5" y1="44.5" x2="41.2" y2="41.2" stroke="#818cf8" stroke-width="1.3" />

    <text x="274" y="43" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#6d5d8c" letter-spacing="1">
